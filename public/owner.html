<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis — Владелец</title><style>body{font-family:Arial,sans-serif;background:#0d0f12;color:#fff;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.nav{display:flex;gap:8px}.nav a{flex:1;text-align:center;padding:12px;border:1px solid #34383e;border-radius:10px;color:#ddd;text-decoration:none;background:#181b1f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.card{background:#15181c;border:1px solid #30353b;border-radius:14px;padding:16px}.card b{font-size:30px;display:block;margin-top:8px}.queue{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.search{display:flex;gap:8px;margin:20px 0}.search input{flex:1;padding:12px;background:#111317;color:#fff;border:1px solid #34383e;border-radius:10px}.search button{padding:12px 18px}.visit{padding:12px;border-bottom:1px solid #30353b}.muted{color:#888}@media(max-width:600px){.grid,.queue{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Автохирург · Владелец</h1><div class="nav"><a href="/">Мастер</a><a href="/owner.html">Владелец</a></div><div class="search"><input id="accessKey" type="password" autocomplete="off" placeholder="Ключ доступа CRM"><button id="login">Войти</button><button id="logout">Выйти</button></div><div id="authStatus" class="muted">Для просмотра данных введите ключ доступа.</div><div class="grid"><div class="card">Заказ-наряды<b id="total">—</b></div><div class="card">Согласовано<b id="approved">—</b></div><div class="card">Выдано<b id="handed">—</b></div></div><h2>Очередь</h2><div id="queue" class="queue"><div class="muted">Загрузка…</div></div><div class="search"><input id="q" placeholder="VIN или госномер"><button id="go">История</button></div><div id="history"></div></div><script>
const opsToken=()=>sessionStorage.getItem("avtohirurg_ops_token")||"";
const opsFetch=(url)=>{const t=opsToken();if(!t)throw Error("Не указан ключ доступа");return fetch(url,{headers:{"x-ops-token":t}}).then(r=>{if(r.status===401){sessionStorage.removeItem("avtohirurg_ops_token");throw Error("Неверный ключ доступа");}if(!r.ok)throw Error("CRM: "+r.status);return r;});};
login.onclick=()=>{const v=accessKey.value.trim();if(!v){authStatus.textContent="Введите ключ доступа.";return;}sessionStorage.setItem("avtohirurg_ops_token",v);accessKey.value="";authStatus.textContent="Проверка доступа…";dashboard();};logout.onclick=()=>{sessionStorage.removeItem("avtohirurg_ops_token");authStatus.textContent="Вы вышли из CRM.";queue.textContent="Нет доступа";history.textContent="";};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function dashboard(){if(!opsToken()){queue.textContent="Введите ключ доступа выше";return;}try{let r=await opsFetch("/api/ops/dashboard"),j=await r.json();total.textContent=j.kpi?.total??0;approved.textContent=j.kpi?.approved??0;handed.textContent=j.kpi?.handed_over??0;authStatus.textContent="Доступ подтверждён";queue.innerHTML=(j.by_status||[]).map(x=>'<div class="card"><b>'+esc(x.count)+'</b>'+esc(x.status)+'</div>').join("")||'<div class="muted">Очередь пуста</div>'}catch(e){authStatus.textContent=e.message||"Ошибка доступа";queue.textContent="Данные недоступны"}}
go.onclick=async()=>{let v=q.value.trim();if(!v)return;let r=await opsFetch("/api/ops/vehicle?q="+encodeURIComponent(v)),j=await r.json();history.innerHTML=(j.visits||[]).map(x=>'<div class="visit"><b>'+esc(x.id)+'</b> · '+esc(x.car)+' · '+esc(x.status)+'<br>'+esc(x.finding||x.complaint||"")+'</div>').join("")||'<div class="muted">История не найдена</div>'};dashboard();</script></body></html>
