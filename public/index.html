<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автохирург-Jarvis</title>
<style>
body{font-family:Arial,sans-serif;background:#0d0f12;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#777}.hint{color:#888;font-size:14px;margin:6px 0 20px}
.card{width:min(680px,90vw);padding:32px;border:1px solid #333;border-radius:20px;background:#1a1a1a;text-align:center}
button{font-size:20px;padding:16px 28px;border:0;border-radius:12px;cursor:pointer}
button:disabled{opacity:.5}.status{margin:18px 0;color:#aaa;min-height:24px}
#log{white-space:pre-wrap;text-align:left;background:#0b0b0b;padding:16px;border-radius:12px;min-height:100px;line-height:1.5}.tool{display:none}.result{margin:8px 0;padding:12px 14px;background:#151515;border:1px solid #262626;border-radius:12px}.command{color:#bbb;margin-top:12px}.approval{margin:10px 0;padding:12px 14px;background:#211d13;border:1px solid #4a3d1c;border-radius:12px}.error{margin:10px 0;padding:12px 14px;background:#241515;border:1px solid #4a2222;border-radius:12px}.pdf{margin:10px 0;padding:14px;background:#121922;border:1px solid #26374a;border-radius:12px}.pdf a{display:inline-block;margin-top:8px;color:#8fc4ff;font-weight:700;text-decoration:none}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 16px}.quick button{font-size:14px;padding:11px 10px;background:#24272c;color:#eee;border:1px solid #363a40}.quick button:hover{background:#2d3137}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 18px}.flow span{font-size:11px;color:#8b9098;padding:7px 3px;border-top:2px solid #34383e}.flow span:first-child{border-top-color:#55d187}.case{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}.case input{box-sizing:border-box;width:100%;background:#111317;color:#fff;border:1px solid #34383e;border-radius:10px;padding:11px 12px;font-size:14px}.case input::placeholder{color:#686e76}.case .wide{grid-column:1/-1}.case textarea{box-sizing:border-box;width:100%;min-height:72px;resize:vertical;background:#111317;color:#fff;border:1px solid #34383e;border-radius:10px;padding:11px 12px;font-size:14px}.case textarea::placeholder{color:#686e76}.case select{box-sizing:border-box;width:100%;background:#111317;color:#fff;border:1px solid #34383e;border-radius:10px;padding:11px 12px;font-size:14px}.case-actions{display:flex;gap:8px;margin:0 0 14px}.case-actions button{flex:1;font-size:13px;padding:10px;background:#181b1f;color:#ddd;border:1px solid #34383e}.progress{height:6px;background:#24272c;border-radius:99px;overflow:hidden;margin:-6px 0 16px}.progress i{display:block;height:100%;width:0;background:#55d187;transition:width .2s}.case-meta{display:flex;justify-content:space-between;gap:10px;color:#777;font-size:11px;margin:-6px 0 12px}.case .invalid{border-color:#9a4f4f}.case .valid{border-color:#315c42}.consent{grid-column:1/-1;display:flex;align-items:flex-start;gap:9px;text-align:left;color:#aaa;font-size:12px;padding:9px 2px}.consent input{width:auto;margin-top:2px}@media(max-width:520px){.flow{grid-template-columns:1fr}.flow span{border-top:0;border-left:2px solid #34383e;text-align:left;padding-left:9px}.flow span:first-child{border-left-color:#55d187}}.quick button:disabled{opacity:.35;cursor:not-allowed}.state{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#666}.dot.online{background:#55d187;box-shadow:0 0 0 4px rgba(85,209,135,.1)}.dot.busy{background:#e2b65c}.dot.error{background:#e26d6d}@media(max-width:520px){.quick{grid-template-columns:1fr}.card{padding:22px}}
</style></head>
<body><div class="card">
<div class="eyebrow">Автохирург · AI оператор</div><h1>Jarvis</h1><p class="hint">Диагностика, сервисные команды и документы голосом</p>
<button id="start">🎙 Запустить Jarvis</button>
<div id="status" class="status state"><span id="stateDot" class="dot"></span><span id="stateText">Готов к запуску</span></div><div class="flow"><span>1. Жалоба</span><span>2. Проверка</span><span>3. Доказательство</span><span>4. Вывод</span><span>5. Документ</span></div><div class="case"><input id="car" placeholder="Автомобиль, например Tiguan"><input id="plate" placeholder="Госномер"><input id="mileage" placeholder="Пробег"><input id="vin" placeholder="VIN"><input id="complaint" class="wide" placeholder="Жалоба клиента"><textarea id="evidence" class="wide" placeholder="Доказательство: что измерили, увидели или воспроизвели"></textarea><textarea id="finding" class="wide" placeholder="Подтверждённая неисправность / вывод"></textarea><select id="urgency"><option value="">Срочность ремонта</option><option>Критично — эксплуатация нежелательна</option><option>Срочно — устранить в ближайшее время</option><option>Планово</option><option>Наблюдение</option></select><input id="recommendation" placeholder="Рекомендация по ремонту"><label class="consent"><input id="repairApproved" type="checkbox"> <span>Клиент согласовал предложенный ремонт</span></label><textarea id="repairResult" class="wide" placeholder="Что выполнено при ремонте"></textarea><textarea id="controlCheck" class="wide" placeholder="Контрольная проверка после ремонта: результат"></textarea><input id="mediaUrl" class="wide" placeholder="Ссылка на фото/видео-доказательство"><input id="nextService" class="wide" placeholder="Следующий контроль / рекомендация, например через 10 000 км"><input id="warranty" class="wide" placeholder="Гарантия на выполненные работы"><textarea id="clientHandover" class="wide" placeholder="Что объяснили клиенту при выдаче автомобиля"></textarea><label class="consent"><input id="finalCheck" type="checkbox"> <span>Финальная контрольная проверка пройдена, жалоба устранена</span></label></div><div class="case-meta"><span id="caseCompleteness">Карта: 0%</span><span id="caseState">Черновик</span></div><div class="progress"><i id="caseProgress"></i></div><div class="case-actions"><button id="newCase" type="button">Новая диагностика</button><button id="saveCase" type="button">Сохранить карту</button></div><div class="quick"><button data-command="Проверь подключение MCP">Проверить MCP</button><button data-command="Покажи диагностический чек-лист 12 пунктов">Чек-лист 12 пунктов</button><button data-command="Сформируй вывод для клиента по результатам диагностики">Вывод клиенту</button><button data-command="Создай тестовое диагностическое заключение PDF">Диагностический PDF</button></div><div id="log"><div class="hint">Нажмите «Запустить Jarvis» и говорите обычным языком.</div></div>
</div>
<script>
let pc,dc,stream;
const statusEl=document.querySelector("#status"),stateDot=document.querySelector("#stateDot"),stateText=document.querySelector("#stateText"),log=document.querySelector("#log"),btn=document.querySelector("#start"),quickButtons=[...document.querySelectorAll(".quick button")],caseFields={car:document.querySelector("#car"),plate:document.querySelector("#plate"),mileage:document.querySelector("#mileage"),vin:document.querySelector("#vin"),complaint:document.querySelector("#complaint"),evidence:document.querySelector("#evidence"),finding:document.querySelector("#finding"),urgency:document.querySelector("#urgency"),recommendation:document.querySelector("#recommendation"),repairApproved:document.querySelector("#repairApproved"),repairResult:document.querySelector("#repairResult"),controlCheck:document.querySelector("#controlCheck"),mediaUrl:document.querySelector("#mediaUrl"),nextService:document.querySelector("#nextService"),warranty:document.querySelector("#warranty"),clientHandover:document.querySelector("#clientHandover"),finalCheck:document.querySelector("#finalCheck")};
const caseCompleteness=document.querySelector("#caseCompleteness"),caseState=document.querySelector("#caseState"),caseProgress=document.querySelector("#caseProgress");
const normalizeVin=v=>String(v||"").toUpperCase().replace(/\s+/g,"");
const updateCaseQuality=()=>{
 const vin=normalizeVin(caseFields.vin.value); caseFields.vin.value=vin;
 const vinOk=!vin || /^[A-HJ-NPR-Z0-9]{17}$/.test(vin);
 caseFields.vin.classList.toggle("invalid",!vinOk); caseFields.vin.classList.toggle("valid",!!vin&&vinOk);
 const mileage=String(caseFields.mileage.value||"").replace(/[^0-9]/g,""); const mileageOk=!mileage || (+mileage>0&&+mileage<3000000);
 caseFields.mileage.classList.toggle("invalid",!mileageOk); caseFields.mileage.classList.toggle("valid",!!mileage&&mileageOk);
 const required=["car","complaint","evidence","finding"]; const filled=required.filter(k=>caseFields[k].value.trim()).length;
 const score=Math.round(filled/required.length*100); caseCompleteness.textContent="Карта: "+score+"%";caseProgress.style.width=score+"%";
 const closeReady=caseFields.repairApproved.checked&&caseFields.repairResult.value.trim()&&caseFields.controlCheck.value.trim();
 if(caseFields.finalCheck.checked&&!closeReady){caseFields.finalCheck.checked=false;logEvent("⚠️ Нельзя закрыть цикл: нужны согласование ремонта, выполненные работы и контрольная проверка.");}
 caseFields.finalCheck.disabled=!closeReady;
 caseState.textContent=caseFields.finalCheck.checked?"Цикл завершён":closeReady?"Готова к финальной проверке":score===100&&vinOk&&mileageOk?"Готова к заключению":filled?"Диагностика в работе":"Черновик";
 return {vinOk,mileageOk,score};
};
const setQuickEnabled=enabled=>{quickButtons.forEach(b=>{b.disabled=!enabled;if(enabled&&/Вывод клиенту|Диагностический PDF/.test(b.textContent)){const q=updateCaseQuality();b.disabled=q.score<100||!q.vinOk||!q.mileageOk;}})};
setQuickEnabled(false);\nconst CASE_KEY="avtohirurg_jarvis_case_v1";\nconst saveCase=()=>{const quality=updateCaseQuality();if(quality.score<100){logEvent("⚠️ Для готовой карты заполните автомобиль, жалобу, доказательство и подтверждённую неисправность.");return;}if(!quality.vinOk||!quality.mileageOk){logEvent("⚠️ Проверьте VIN и пробег перед сохранением.");return;}const data=Object.fromEntries(Object.entries(caseFields).map(([k,el])=>[k,el.type==="checkbox"?el.checked:el.value]));localStorage.setItem(CASE_KEY,JSON.stringify(data));logEvent("✅ Карта диагностики сохранена на этом устройстве.");};\nconst restoreCase=()=>{try{const data=JSON.parse(localStorage.getItem(CASE_KEY)||"{}");Object.entries(caseFields).forEach(([k,el])=>{if(data[k]!==undefined){if(el.type==="checkbox")el.checked=!!data[k];else if(data[k])el.value=data[k]}});}catch{}};\nconst clearCase=()=>{Object.values(caseFields).forEach(el=>{if(el.type==="checkbox")el.checked=false;else el.value="";el.classList.remove("valid","invalid")});localStorage.removeItem(CASE_KEY);updateCaseQuality();log.replaceChildren();const hint=document.createElement("div");hint.className="hint";hint.textContent="Новая диагностика: заполните автомобиль и жалобу клиента.";log.appendChild(hint);};\ndocument.querySelector("#saveCase").addEventListener("click",saveCase);\ndocument.querySelector("#newCase").addEventListener("click",clearCase);\nObject.values(caseFields).forEach(el=>{const persist=()=>{updateCaseQuality();if(dc?.readyState==="open")setQuickEnabled(true);const data=Object.fromEntries(Object.entries(caseFields).map(([k,x])=>[k,x.type==="checkbox"?x.checked:x.value]));localStorage.setItem(CASE_KEY,JSON.stringify(data));};el.addEventListener("input",persist);el.addEventListener("change",persist);});\nrestoreCase();updateCaseQuality();\n
const status=(t,state="")=>{stateText.textContent=t;stateDot.className="dot"+(state?" "+state:"");};
const logEvent=t=>{
 const line=document.createElement("div");
 const v=String(t);
 if(v.startsWith("🔧 ")) return;
 if(v.startsWith("🎙 ")) {line.className="command";line.textContent="Вы: "+v.slice(3);}
 else if(v.startsWith("✅ ")) {line.className="result";line.textContent=v.slice(2);}
 else if(v.startsWith("⚠️ ")) {line.className="approval";line.textContent=v.slice(2);}
 else if(v.startsWith("❌ ")) {line.className="error";line.textContent="Ошибка: "+v.slice(2);}
 else {line.textContent=v;}
 log.appendChild(line);
};
const showPdfResult=(raw)=>{
 try{
  const parsed=typeof raw==="string"?JSON.parse(raw):raw;
  const item=parsed?.content?.find?.(x=>x?.type==="resource"&&x?.resource?.blob);
  if(!item) return false;
  const filename=decodeURIComponent((item.resource.uri||"diagnostic.pdf").split(":").pop());
  const box=document.createElement("div"); box.className="pdf";
  const title=document.createElement("div"); title.textContent="Диагностический PDF создан";
  const a=document.createElement("a"); a.href="data:"+(item.resource.mimeType||"application/pdf")+";base64,"+item.resource.blob; a.download=filename; a.target="_blank"; a.rel="noopener"; a.textContent="📄 Открыть / скачать "+filename;
  box.appendChild(title); box.appendChild(a); log.appendChild(box); return true;
 }catch(e){return false;}
};
const waitIce=()=>new Promise(resolve=>{
 if(pc.iceGatheringState==="complete") return resolve();
 const done=()=>{if(pc.iceGatheringState==="complete"){pc.removeEventListener("icegatheringstatechange",done);resolve()}};
 pc.addEventListener("icegatheringstatechange",done);
});
async function start(){
 try{
  btn.disabled=true; status("Запрашиваю микрофон…","busy");
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const audioTrack=stream.getAudioTracks()[0];
  if(!audioTrack) throw new Error("Микрофон не вернул аудиодорожку");
  pc=new RTCPeerConnection();
  const audio=document.createElement("audio"); audio.autoplay=true; audio.playsInline=true; document.body.appendChild(audio);
  pc.ontrack=e=>{audio.srcObject=e.streams[0]; audio.play().catch(err=>{
   const msg=err?.message||String(err);
   if(/not allowed|denied permission|user agent|platform|NotAllowedError/i.test(msg)){
    logEvent("ℹ️ iPhone временно заблокировал автозапуск звука. Коснитесь экрана и продолжайте говорить.");
   }else{ logEvent("⚠️ Audio: "+msg); }
  })};
  const audioTransceiver=pc.addTransceiver("audio",{direction:"sendrecv"});
  await audioTransceiver.sender.replaceTrack(audioTrack);
  dc=pc.createDataChannel("oai-events");
  let inputTranscript="";
  let transcriptTimer=null;
  let lastRoutedTranscript="";
  let pendingApprovalId="";
  const speakResult=(content)=>{
   if(dc.readyState==="open"){
    dc.send(JSON.stringify({
     type:"session.commentary.append",
     event_id:"browser_result_"+crypto.randomUUID(),
     delegation_id:null,
     content
    }));
   }
  };
  const routeTranscript=async()=>{
   const text=inputTranscript.trim();
   if(!text || text===lastRoutedTranscript) return;
   lastRoutedTranscript=text;
   // Treat each debounce as a completed command. This prevents words from a
   // previous utterance (for example "Стоп") from re-triggering an old tool.
   inputTranscript="";
   logEvent("🎙 "+text);
   try{
    if(/^(джарвис[ ,]*)?(стоп|остановись|останови|хватит|замолчи)[.! ]*$/i.test(text)){
     if(audio) { audio.muted=true; audio.pause(); audio.currentTime=0; }
     setTimeout(()=>{ if(audio){ audio.muted=false; audio.play().catch(err=>{ const msg=err?.message||String(err); if(!/not allowed|denied permission|user agent|platform|NotAllowedError/i.test(msg)) logEvent("⚠️ Audio: "+msg); }); } },350);
     logEvent("⏹ Ответ Jarvis остановлен");
     return;
    }
    if(pendingApprovalId && /^(джарвис[ ,]*)?(подтверждаю|подтвердить|да подтверждаю)/i.test(text)){
     const r=await fetch("/api/approval/confirm",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({approval_id:pendingApprovalId})
     });
     const data=await r.json();
     if(!r.ok) throw new Error(data.error||"Approval failed");
     pendingApprovalId="";
     const message=data.result||"Подтверждение принято.";
     logEvent("✅ "+message);
     speakResult(message);
     return;
    }
    if(pendingApprovalId && /^(джарвис[ ,]*)?(отмена|отменить|не подтверждаю)/i.test(text)){
     await fetch("/api/approval/cancel",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({approval_id:pendingApprovalId})
     });
     pendingApprovalId="";
     logEvent("⛔ Действие отменено.");
     speakResult("Действие отменено.");
     return;
    }
    const r=await fetch("/api/route-transcript",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({text})
    });
    if(r.status===204) return;
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Backend task failed");
    if(data.ok){
     if(data.approval_required){
      pendingApprovalId=data.approval_id;
      logEvent("⚠️ "+data.result);
      speakResult(data.result+" Скажите: подтверждаю, или: отмена.");
      return;
     }
     if(data.tool) logEvent("🔧 "+data.tool);
     const rawResult=typeof data.result==="string" ? data.result : JSON.stringify(data.result);
     const hasEmbeddedResource=data.tool==="generate_client_diagnostic_pdf" || /"type"\s*:\s*"resource"/i.test(rawResult) || /"blob"\s*:/i.test(rawResult);
     if(hasEmbeddedResource){
      if(!showPdfResult(data.result)) logEvent("✅ Диагностический PDF создан.");
      speakResult("Диагностический PDF успешно создан.");
     }else{
      logEvent("✅ "+rawResult);
      const voiceResult=rawResult.length>700 ? rawResult.slice(0,700)+"…" : rawResult;
      speakResult("Результат проверки: "+voiceResult);
     }
    }
   }catch(error){
    logEvent("❌ "+(error.message||String(error)));
   }
  };
  dc.onmessage=e=>{
   try{
    const ev=JSON.parse(e.data);
    if(ev.type==="session.started"){status("Jarvis онлайн — говорите","online");setQuickEnabled(true);}
    if(ev.type==="session.input_transcript.delta"){
     inputTranscript+=(ev.delta||"");
     clearTimeout(transcriptTimer);
     transcriptTimer=setTimeout(routeTranscript,900);
    }
    if(ev.type==="session.output_transcript.delta"){
     // Assistant transcript is intentionally not routed to the task backend.
    }
    if(ev.type==="error"){status("Ошибка голосового соединения","error");logEvent("❌ Голосовое соединение прервано. Запустите Jarvis повторно.");console.error("Live error",ev)}
   }catch(error){logEvent("Event error: "+(error.message||String(error)))}
  };
  const offer=await pc.createOffer({offerToReceiveAudio:true});
  await pc.setLocalDescription(offer);
  await waitIce();
  const localSdp=pc.localDescription?.sdp||"";
  if(!/m=audio\s/i.test(localSdp)) throw new Error("WebRTC не сформировал audio media section");
  const answer=await fetch("/api/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sdp:pc.localDescription.sdp})});
  const data=await answer.json();
  if(!answer.ok) throw new Error(data.error?.message||data.error||JSON.stringify(data));
  await pc.setRemoteDescription({type:"answer",sdp:data.transport.sdp});
  status("Подключение Jarvis…","busy");
 }catch(e){
  status("Ошибка запуска","error"); setQuickEnabled(false); logEvent("❌ Не удалось запустить Jarvis. Попробуйте ещё раз."); console.error(e); btn.disabled=false;
 }
}
btn.onclick=start;
quickButtons.forEach(q=>q.onclick=()=>{
 if(!dc || dc.readyState!=="open"){setQuickEnabled(false);logEvent("⚠️ Сначала запустите Jarvis.");return;}
 let command=q.dataset.command||"";
 const details=[
  caseFields.car.value&&"автомобиль "+caseFields.car.value,
  caseFields.plate.value&&"госномер "+caseFields.plate.value,
  caseFields.mileage.value&&"пробег "+caseFields.mileage.value,
  caseFields.vin.value&&"VIN "+caseFields.vin.value,
  caseFields.complaint.value&&"жалоба клиента: "+caseFields.complaint.value,\n  caseFields.evidence.value&&"доказательство: "+caseFields.evidence.value,\n  caseFields.finding.value&&"подтверждённая неисправность: "+caseFields.finding.value,\n  caseFields.urgency.value&&"срочность: "+caseFields.urgency.value,\n  caseFields.recommendation.value&&"рекомендация: "+caseFields.recommendation.value,\n  caseFields.repairApproved.checked&&"ремонт согласован: да",\n  caseFields.repairResult.value&&"выполненный ремонт: "+caseFields.repairResult.value,\n  caseFields.controlCheck.value&&"контрольная проверка: "+caseFields.controlCheck.value,\n  caseFields.mediaUrl.value&&"медиа доказательство: "+caseFields.mediaUrl.value,\n  caseFields.nextService.value&&"следующий контроль: "+caseFields.nextService.value,\n  caseFields.warranty.value&&"гарантия: "+caseFields.warranty.value,\n  caseFields.clientHandover.value&&"выдача клиенту: "+caseFields.clientHandover.value,\n  caseFields.finalCheck.checked&&"финальная проверка: пройдена"
 ].filter(Boolean).join(", ");
 inputTranscript=details?command+". Данные: "+details:command;
 clearTimeout(transcriptTimer);
 transcriptTimer=setTimeout(routeTranscript,20);
});
</script></body></html>
