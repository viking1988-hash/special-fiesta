<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Автохирург-Jarvis</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{width:min(680px,90vw);padding:32px;border:1px solid #333;border-radius:20px;background:#1a1a1a;text-align:center}
button{font-size:20px;padding:16px 28px;border:0;border-radius:12px;cursor:pointer}
button:disabled{opacity:.5}.status{margin:18px 0;color:#aaa;min-height:24px}
#log{white-space:pre-wrap;text-align:left;background:#0b0b0b;padding:16px;border-radius:12px;min-height:100px}
</style></head>
<body><div class="card">
<h1>Автохирург-Jarvis</h1><p>Голосовой интерфейс</p>
<button id="start">🎙 Запустить Jarvis</button>
<div id="status" class="status">Готов к запуску</div><div id="log"></div>
</div>
<script>
let pc,dc,stream;
const statusEl=document.querySelector("#status"),log=document.querySelector("#log"),btn=document.querySelector("#start");
const status=t=>statusEl.textContent=t;
const logEvent=t=>{log.textContent+=t+"\n"};
const waitIce=()=>new Promise(resolve=>{
 if(pc.iceGatheringState==="complete") return resolve();
 const done=()=>{if(pc.iceGatheringState==="complete"){pc.removeEventListener("icegatheringstatechange",done);resolve()}};
 pc.addEventListener("icegatheringstatechange",done);
});
async function start(){
 try{
  btn.disabled=true; status("Запрашиваю микрофон…");
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const audioTrack=stream.getAudioTracks()[0];
  if(!audioTrack) throw new Error("Микрофон не вернул аудиодорожку");
  pc=new RTCPeerConnection();
  const audio=document.createElement("audio"); audio.autoplay=true; audio.playsInline=true; document.body.appendChild(audio);
  pc.ontrack=e=>{audio.srcObject=e.streams[0]; audio.play().catch(()=>{})};
  const audioTransceiver=pc.addTransceiver("audio",{direction:"sendrecv"});
  await audioTransceiver.sender.replaceTrack(audioTrack);
  dc=pc.createDataChannel("oai-events");
  let inputTranscript="";
  let transcriptTimer=null;
  let lastRoutedTranscript="";
  const routeTranscript=async()=>{
   const text=inputTranscript.trim();
   if(!text || text===lastRoutedTranscript) return;
   lastRoutedTranscript=text;
   logEvent("🎙 "+text);
   try{
    const r=await fetch("/api/route-transcript",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({text})
    });
    if(r.status===204) return;
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Backend task failed");
    if(data.ok){
     logEvent("🔧 "+data.tool);
     logEvent("✅ "+data.result);
     if(dc.readyState==="open"){
      dc.send(JSON.stringify({
       type:"session.commentary.append",
       event_id:"browser_result_"+crypto.randomUUID(),
       delegation_id:null,
       content:"Результат проверки: "+data.result
      }));
     }
    }
   }catch(error){
    logEvent("❌ "+(error.message||String(error)));
   }
  };
  dc.onmessage=e=>{
   try{
    const ev=JSON.parse(e.data);
    if(ev.type==="session.started") status("🟢 Jarvis онлайн — говорите");
    if(ev.type==="session.input_transcript.delta"){
     inputTranscript+=(ev.delta||"");
     clearTimeout(transcriptTimer);
     transcriptTimer=setTimeout(routeTranscript,900);
    }
    if(ev.type==="session.output_transcript.delta"){
     // Assistant transcript is intentionally not routed to the task backend.
    }
    if(ev.type==="error"){status("Ошибка Live");logEvent(JSON.stringify(ev))}
   }catch(error){logEvent("Event error: "+(error.message||String(error)))}
  };
  const offer=await pc.createOffer({offerToReceiveAudio:true});
  await pc.setLocalDescription(offer);
  await waitIce();
  const localSdp=pc.localDescription?.sdp||"";
  if(!/m=audio\s/i.test(localSdp)) throw new Error("WebRTC не сформировал audio media section");
  const answer=await fetch("/api/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sdp:pc.localDescription.sdp})});
  const data=await answer.json();
  if(!answer.ok) throw new Error(data.error?.message||data.error||JSON.stringify(data));
  await pc.setRemoteDescription({type:"answer",sdp:data.transport.sdp});
  status("🟡 Подключение Jarvis…");
 }catch(e){
  status("Ошибка запуска"); logEvent(e.message||String(e)); btn.disabled=false;
 }
}
btn.onclick=start;
</script></body></html>
