name: CRM PostgreSQL integration
on:
  pull_request:
  push:
    branches: [feature/crm-personal-auth]
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_test -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRM_TEST_DATABASE_URL: postgresql://crm_test:local_ci_only@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test test/crm-postgres.integration.test.cjs
