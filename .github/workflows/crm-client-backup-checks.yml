name: CRM client backup checks
on:
  pull_request:
    paths:
      - 'scripts/crm-clients-*.sh'
      - 'scripts/crm-client-backup-verify.sh'
      - '.github/workflows/crm-client-backup-checks.yml'
  workflow_dispatch:
jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Static analysis of backup scripts
        run: shellcheck -S warning scripts/crm-clients-export.sh scripts/crm-clients-yandex-upload.sh scripts/crm-clients-backup-job.sh scripts/crm-client-backup-verify.sh
      - name: Validate shell syntax
        run: |
          bash -n scripts/crm-clients-export.sh
          bash -n scripts/crm-clients-yandex-upload.sh
          bash -n scripts/crm-clients-backup-job.sh
          bash -n scripts/crm-client-backup-verify.sh
      - name: Verify child scripts are launched through bash
        run: |
          grep -Fq 'bash "$here/crm-clients-export.sh" "$archive"' scripts/crm-clients-backup-job.sh
          grep -Fq 'bash "$here/crm-clients-yandex-upload.sh" "$archive"' scripts/crm-clients-backup-job.sh
      - name: Verify missing safety gates fail closed
        run: |
          if CLIENT_BACKUP_ENABLED=true bash scripts/crm-clients-backup-job.sh >/dev/null 2>&1; then
            echo "Unsafe backup job started"; exit 1
          fi
          if CLIENT_BACKUP_ENABLED=true bash scripts/crm-clients-export.sh >/dev/null 2>&1; then
            echo "Unsafe export started"; exit 1
          fi
          if CLIENT_BACKUP_ENABLED=true bash scripts/crm-clients-yandex-upload.sh >/dev/null 2>&1; then
            echo "Unsafe upload started"; exit 1
          fi
      - name: Verify backup job stays disabled by default
        run: |
          result="$(env -u CLIENT_BACKUP_ENABLED bash scripts/crm-clients-backup-job.sh)"
          test "$result" = "CLIENT_BACKUP_DISABLED"
      - name: Verify export stays disabled by default
        run: |
          result="$(env -u CLIENT_BACKUP_ENABLED bash scripts/crm-clients-export.sh)"
          test "$result" = "CLIENT_BACKUP_DISABLED"
      - name: Verify upload stays disabled by default
        run: |
          result="$(env -u CLIENT_BACKUP_ENABLED bash scripts/crm-clients-yandex-upload.sh)"
          test "$result" = "CLIENT_BACKUP_DISABLED"
