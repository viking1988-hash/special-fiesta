name: CRM synthetic client restore rehearsal
on:
  pull_request:
    paths:
      - 'backup/**'
      - 'test/backup/**'
      - 'scripts/crm-client*.sh'
      - '.github/workflows/crm-clients-restore-rehearsal.yml'
  workflow_dispatch:
jobs:
  synthetic-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Install backup tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client
      - name: Start local disposable PostgreSQL on runner
        run: |
          sudo apt-get install -y -qq postgresql-16
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'ci-only'"
          test "$(psql -h 127.0.0.1 -d postgres -Atqc 'SELECT host(inet_server_addr())')" = '127.0.0.1'
      - name: Create synthetic source and empty restore database
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE crm_test_clients_source'
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE crm_test_clients_restore'
          for db in crm_test_clients_source crm_test_clients_restore; do
            psql -d "$db" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.customers (id bigint PRIMARY KEY, organization_id bigint, name text, phone text); CREATE TABLE public.vehicles (id bigint PRIMARY KEY, organization_id bigint, customer_id bigint REFERENCES public.customers(id), vin text);'
          done
          psql -d crm_test_clients_source -v ON_ERROR_STOP=1 -c 'INSERT INTO public.customers VALUES (101,1,$$Synthetic customer$$,$$TEST-PHONE$$),(102,2,$$Synthetic second$$,NULL); INSERT INTO public.vehicles VALUES (201,1,101,$$TEST-VIN-1$$),(202,2,102,NULL);'
      - name: Encrypt, restore and verify synthetic clients
        run: |
          age-keygen -o /tmp/client-ci-identity.txt 2>/dev/null
          age-keygen -o /tmp/client-ci-recovery-identity.txt 2>/dev/null
          export AGE_RECIPIENT_PRIMARY="$(age-keygen -y /tmp/client-ci-identity.txt)"
          export AGE_RECIPIENT_RECOVERY="$(age-keygen -y /tmp/client-ci-recovery-identity.txt)"
          test "$AGE_RECIPIENT_PRIMARY" != "$AGE_RECIPIENT_RECOVERY"
          export CLIENT_BACKUP_ENABLED=true CLIENT_BACKUP_SCHEMA_VERIFIED=YES
          export DATABASE_URL='postgresql://postgres:ci-only@localhost:5432/crm_test_clients_source'
          bash scripts/crm-clients-export.sh /tmp/clients-20261009T000000Z.dump.age
          # Independently verify both recipients can decrypt the same archive.
          age -d -i /tmp/client-ci-identity.txt /tmp/clients-20261009T000000Z.dump.age | pg_restore -l >/dev/null
          age -d -i /tmp/client-ci-recovery-identity.txt /tmp/clients-20261009T000000Z.dump.age | pg_restore -l >/dev/null
          export CLIENT_BACKUP_ARCHIVE=/tmp/clients-20261009T000000Z.dump.age
          export AGE_IDENTITY_FILE=/tmp/client-ci-identity.txt
          export TEST_DATABASE_URL='postgresql://postgres:ci-only@localhost:5432/crm_test_clients_restore'
          export CLIENT_BACKUP_TEST_CONFIRM=ISOLATED CLIENT_BACKUP_TEST_DB_EMPTY_CONFIRMED=YES
          export CLIENT_BACKUP_EXPECTED_TEST_DB=crm_test_clients_restore
          export CLIENT_BACKUP_EXPECTED_CLUSTER_ID="$(psql -d postgres -Atqc 'SELECT system_identifier FROM pg_control_system()')"
          test -n "$CLIENT_BACKUP_EXPECTED_CLUSTER_ID"
          if CLIENT_BACKUP_EXPECTED_CLUSTER_ID=1234567890123456789 bash scripts/crm-client-backup-verify.sh; then
            echo "Wrong cluster identity was accepted"; exit 1
          fi
          bash scripts/crm-client-backup-verify.sh
          test "$(psql -d crm_test_clients_restore -Atqc 'SELECT count(*) FROM public.customers')" = 2
          test "$(psql -d crm_test_clients_restore -Atqc 'SELECT count(*) FROM public.vehicles')" = 2
          test "$(psql -d crm_test_clients_restore -Atqc 'SELECT count(*) FROM public.vehicles v JOIN public.customers c ON c.id=v.customer_id AND c.organization_id=v.organization_id')" = 2
          if bash scripts/crm-client-backup-verify.sh; then
            echo 'Nonempty restore target was accepted'; exit 1
          fi
          age-keygen -o /tmp/wrong-identity.txt 2>/dev/null
          if AGE_IDENTITY_FILE=/tmp/wrong-identity.txt bash scripts/crm-client-backup-verify.sh; then
            echo 'Wrong key was accepted'; exit 1
          fi
          head -c 80 "$CLIENT_BACKUP_ARCHIVE" > /tmp/truncated.dump.age
          if CLIENT_BACKUP_ARCHIVE=/tmp/truncated.dump.age bash scripts/crm-client-backup-verify.sh; then
            echo 'Truncated archive was accepted'; exit 1
          fi
          if CLIENT_BACKUP_EXPECTED_TEST_DB=crm_test_wrong bash scripts/crm-client-backup-verify.sh; then
            echo 'Wrong target identity was accepted'; exit 1
          fi
          if DATABASE_URL='postgresql://postgres:ci-only@localhost:5432/crm_test_missing' bash scripts/crm-clients-export.sh /tmp/failed-export.dump.age; then
            echo 'Failed database export was accepted'; exit 1
          fi
          test ! -e /tmp/failed-export.dump.age
          test ! -e /tmp/failed-export.dump.age.partial
          # Disabled export must not create an archive.
          if CLIENT_BACKUP_ENABLED=false bash scripts/crm-clients-export.sh /tmp/disabled-export.dump.age; then
            test ! -e /tmp/disabled-export.dump.age
          else
            echo 'Disabled export unexpectedly failed'; exit 1
          fi
          # Cross-organization linkage must be rejected on a fresh isolated restore.
          psql -d crm_test_clients_source -v ON_ERROR_STOP=1 -c 'UPDATE public.vehicles SET organization_id=99 WHERE id=201'
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE crm_test_clients_mismatch'
          psql -d crm_test_clients_mismatch -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.customers (id bigint PRIMARY KEY, organization_id bigint, name text, phone text); CREATE TABLE public.vehicles (id bigint PRIMARY KEY, organization_id bigint, customer_id bigint REFERENCES public.customers(id), vin text);'
          export DATABASE_URL='postgresql://postgres:ci-only@localhost:5432/crm_test_clients_source'
          bash scripts/crm-clients-export.sh /tmp/mismatch.dump.age
          export CLIENT_BACKUP_ARCHIVE=/tmp/mismatch.dump.age
          export TEST_DATABASE_URL='postgresql://postgres:ci-only@localhost:5432/crm_test_clients_mismatch'
          export CLIENT_BACKUP_EXPECTED_TEST_DB=crm_test_clients_mismatch
          if bash scripts/crm-client-backup-verify.sh; then
            echo 'Cross-organization client vehicle mismatch was accepted'; exit 1
          fi
          rm -f /tmp/mismatch.dump.age
          rm -f /tmp/client-ci-identity.txt /tmp/client-ci-recovery-identity.txt /tmp/wrong-identity.txt /tmp/clients-20261009T000000Z.dump.age /tmp/truncated.dump.age
